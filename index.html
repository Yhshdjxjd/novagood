<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>অপেক্ষা করুন...</title>
</head>
<body style="text-align: center; font-family: sans-serif; padding: 50px;">

  <!-- এখানে তোমার ব্যানার অ্যাড থাকবে -->
  <div style="background: #eee; padding: 20px; margin-bottom: 20px;">এখানে ব্যানার অ্যাড</div>

  <h2 id="timer-text">অনুগ্রহ করে <span id="countdown">15</span> সেকেন্ড অপেক্ষা করুন...</h2>
  
  <!-- প্রথমে বাটনটি লুকানো থাকবে -->
  <a id="next-btn" href="#" style="display: none; padding: 15px 30px; background: green; color: white; text-decoration: none; border-radius: 5px;">
    Next / Download Now
  </a>

  <!-- নিচেও ব্যানার অ্যাড থাকবে -->
  <div style="background: #eee; padding: 20px; margin-top: 20px;">এখানে আরেকটি ব্যানার অ্যাড</div>

  <script>
    // ১. URL থেকে ?go= এর ভ্যালু নেওয়া
    const params = new URLSearchParams(window.location.search);
    const encodedUrl = params.get('go');

    let targetUrl = "";
    try {
      if (encodedUrl) {
        // Base64 ডিকোড করা
        const decoded = atob(encodedUrl);
        // নিরাপত্তার জন্য চেক করা যে এটা আসলেই http বা https লিংক কি না
        if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
          targetUrl = decoded;
        }
      }
    } catch (e) {
      console.log("ভুল লিংক!");
    }

    // ২. ১৫ সেকেন্ডের টাইমার চালানো
    let timeLeft = 15;
    const countdownEl = document.getElementById('countdown');
    const timerTextEl = document.getElementById('timer-text');
    const nextBtn = document.getElementById('next-btn');

    if (targetUrl) {
      const timer = setInterval(() => {
        timeLeft--;
        countdownEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timerTextEl.textContent = "আপনার লিংক তৈরি!";
          nextBtn.href = targetUrl; // বাটনে আসল লিংক বসিয়ে দেওয়া
          nextBtn.style.display = "inline-block"; // বাটনটি দেখানো
        }
      }, 1000);
    } else {
      timerTextEl.textContent = "দুঃখিত, কোনো সঠিক ডাউনলোড লিংক পাওয়া যায়নি!";
    }
  </script>

</body>
</html>-
